description: >-
  Order-related error code registry. The place-order API returns HTTP 200 for
  errors thrown by downstream systems (risk management, market centers); the
  order's status is checked via the GET order endpoint, whose response includes
  an `errors` property carrying these codes. Most common on complex order
  placement, modification, and cancellation.
